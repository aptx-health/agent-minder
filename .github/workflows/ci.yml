name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build minder binary
        run: go build -o minder ./cmd/minder

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Upload minder binary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: minder-${{ matrix.os }}
          path: minder
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  integration-tests:
    # Surface the supervisor scenario suite as its own visible CI check.
    # The scenarios lock in DB-final-state expectations for the supervisor
    # seams that pure unit tests cannot observe (see #517 / #519). Kept fast
    # so it can also run in the pre-push lefthook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run supervisor scenario suite
        run: make integration

  exit-gate:
    # M1 exit-gate proof (#652): a real Coordinator drives a job through a
    # real worker process; an external client observes snapshot + live
    # events over the real Unix socket, consistent at every watermark, and
    # resumes across a simulated worker restart. Split from
    # integration-tests so its result is visible on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run M1 exit-gate test
        run: make exit-gate
