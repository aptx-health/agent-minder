pre-commit:
  parallel: true
  commands:
    build:
      run: go build ./...
    lint:
      run: golangci-lint run ./...
    fmt:
      glob: "*.go"
      run: |
        UNFMTED=$(gofmt -l {staged_files} 2>&1)
        if [ -n "$UNFMTED" ]; then
          echo "Files not formatted:"
          echo "$UNFMTED"
          exit 1
        fi

# pre-push runs the supervisor scenario integration suite. Locks in
# DB-final-state expectations for the supervisor seams that unit tests cannot
# observe (see #517 / #519). Fast enough to run on every push.
pre-push:
  commands:
    integration:
      run: make integration
